name: CI

on:
  push:
  pull_request:

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ninja-build \
            clang-format \
            clang-tidy

      - name: Install CMake
        uses: lukka/get-cmake@latest
        with:
          cmakeVersion: 4.2.3

      - name: Configure
        run: cmake --preset debug -DVELOX_ENABLE_CLANG_TIDY=ON -DVELOX_ENABLE_WERROR=ON

      - name: Build
        run: cmake --build --preset debug

      - name: Test
        run: ctest --preset debug --output-on-failure

      - name: Check formatting
        run: cmake --build build-debug --target velox-format-check

      - name: Check clang-tidy
        run: cmake --build build-debug --target velox-tidy-check

  sanitize:
    name: ASan + UBSan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ninja-build

      - name: Install CMake
        uses: lukka/get-cmake@latest
        with:
          cmakeVersion: 4.2.3

      - name: Configure
        run: cmake --preset sanitize

      - name: Build
        run: cmake --build --preset sanitize

      - name: Test
        run: ctest --preset sanitize --output-on-failure
